name: CI

on:
  push:
  pull_request:

jobs:
  reproduce:
    name: Reproduce (setup → baseline → advanced → eval)
    runs-on: ubuntu-latest
    # Safety valve: a hung/looping step fails the job instead of silently
    # burning the repo's Actions minutes for the rest of the window.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install rank_bm25 claude-agent-sdk

      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh

      - name: Python syntax check
        run: |
          python3 -m py_compile eval/*.py advanced/*.py baseline/*.py .claude/hooks/guard_deploy.py

      - name: Unit tests (deterministic, no API calls)
        run: |
          python3 eval/test_match.py
          python3 eval/test_sandbox_guard.py
          python3 advanced/build_index.py
          python3 advanced/test_verifier.py

      - name: verify-no-leak (oracle isolation static audit)
        run: make verify-no-leak

      - name: make setup
        run: make setup

      # The baseline/advanced/eval targets make real Anthropic API calls.
      # Without a repo secret they're skipped with a clear notice rather
      # than failing the whole job -- full reproduction requires the key
      # (see README's reproduction guide).
      - name: make baseline
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make baseline

      - name: make advanced
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make advanced

      - name: make eval
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make eval

      - name: Skip notice (no API key configured)
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "::notice::ANTHROPIC_API_KEY repo secret not set — skipped make baseline/advanced/eval (API-calling targets). Lint, unit tests, and the oracle-isolation audit above still ran and must pass. Full reproduction requires the key; see README."
